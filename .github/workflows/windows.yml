name: Legacy PowerShell checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        shell: [powershell, pwsh]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build Windows launchers
        run: .\Build\build.ps1
      - name: Run noninteractive checks
        run: .\Tests\run.ps1 -Report .\dist\checks.json
      - name: Create release ZIP and checksum
        run: .\Build\package.ps1
      - name: Verify release installation helper
        run: .\Tests\test_bootstrap.ps1
      - name: Save tested release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CTC-${{ matrix.os }}-${{ matrix.shell }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/checks.json
          if-no-files-found: error
          retention-days: 14
